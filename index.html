<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05000e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>赛博木鱼 · 功德 +1</title>
<style>
  :root{
    --pink:#ff2d95;
    --cyan:#00f0ff;
    --violet:#a24bff;
    --acid:#f7ff3c;
    --gold:#ffd25a;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background:#05000e;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    position:fixed; inset:0;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:#eafcff;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
    display:flex; align-items:center; justify-content:center;
  }

  /* ============ 背景：霓虹雾 + 透视网格 ============ */
  body::before{
    content:"";
    position:fixed; inset:-10%;
    background:
      radial-gradient(ellipse 60% 45% at 18% 12%, rgba(255,45,149,.22) 0%, rgba(255,45,149,0) 62%),
      radial-gradient(ellipse 55% 45% at 84% 22%, rgba(162,75,255,.20) 0%, rgba(162,75,255,0) 64%),
      radial-gradient(ellipse 70% 50% at 50% 96%, rgba(0,240,255,.20) 0%, rgba(0,240,255,0) 66%);
    pointer-events:none; z-index:0;
  }

  #grid{
    position:fixed; left:-60%; right:-60%; bottom:-6%; height:64%;
    z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,45,149,.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.42) 1px, transparent 1px);
    background-size:64px 64px;
    transform-origin:50% 100%;
    transform:perspective(300px) rotateX(74deg) translateY(0);
    animation:gridRun 2.2s linear infinite;
    -webkit-mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.55) 42%, transparent 88%);
            mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.55) 42%, transparent 88%);
    opacity:.75;
  }
  @keyframes gridRun{
    from{ transform:perspective(300px) rotateX(74deg) translateY(0); }
    to  { transform:perspective(300px) rotateX(74deg) translateY(64px); }
  }

  /* ============ HUD 四角边框 ============ */
  .hud{
    position:fixed; z-index:6; pointer-events:none;
    width:clamp(22px, 6vw, 36px); height:clamp(22px, 6vw, 36px);
    opacity:.85;
  }
  .hud.tl{ top:calc(var(--safe-t) + 12px); left:12px;  border-left:2px solid var(--cyan); border-top:2px solid var(--cyan);
           box-shadow:-2px -2px 14px rgba(0,240,255,.5); }
  .hud.tr{ top:calc(var(--safe-t) + 12px); right:12px; border-right:2px solid var(--cyan); border-top:2px solid var(--cyan);
           box-shadow:2px -2px 14px rgba(0,240,255,.5); }
  .hud.bl{ bottom:calc(var(--safe-b) + 12px); left:12px;  border-left:2px solid var(--pink); border-bottom:2px solid var(--pink);
           box-shadow:-2px 2px 14px rgba(255,45,149,.5); }
  .hud.br{ bottom:calc(var(--safe-b) + 12px); right:12px; border-right:2px solid var(--pink); border-bottom:2px solid var(--pink);
           box-shadow:2px 2px 14px rgba(255,45,149,.5); }

  /* ============ 布局 ============ */
  #stage{
    position:relative; z-index:1;
    width:100%; height:100%;
    padding: calc(var(--safe-t) + 16px) 20px calc(var(--safe-b) + 16px);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: clamp(6px, 2vh, 22px);
  }

  /* ---------- 标题 ---------- */
  #title{
    margin:0;
    font-size: clamp(17px, 5vw, 26px);
    font-weight:800;
    letter-spacing:.30em; text-indent:.30em;
    color:#fff;
    text-shadow:
      -1.5px 0 rgba(255,45,149,.9), 1.5px 0 rgba(0,240,255,.9),
      0 0 14px rgba(162,75,255,.85), 0 0 38px rgba(255,45,149,.5);
    animation: neonFlicker 7s infinite;
  }
  @keyframes neonFlicker{
    0%, 41%, 44%, 46.5%, 74%, 100%{ opacity:1 }
    42%, 45%, 75%{ opacity:.42 }
  }

  #subtitle{
    margin-top:7px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-size: clamp(8.5px, 2.4vw, 10.5px);
    letter-spacing:.24em; text-indent:.24em;
    color:rgba(0,240,255,.62);
    text-shadow:0 0 10px rgba(0,240,255,.6);
    white-space:nowrap;
  }
  #subtitle .dot{
    width:5px; height:5px; border-radius:50%;
    background:var(--acid);
    box-shadow:0 0 8px var(--acid);
    animation:blink 1.6s steps(1) infinite;
    flex:none;
  }
  @keyframes blink{ 0%,55%{opacity:1} 56%,100%{opacity:.15} }

  /* ---------- 功德计数 ---------- */
  #merit-box{ text-align:center; line-height:1; }

  #merit{
    font-size: clamp(46px, 13.5vw, 88px);
    font-weight:800;
    letter-spacing:.02em;
    font-variant-numeric: tabular-nums;
    color:#fff;
    text-shadow:
      -2.5px 0 rgba(255,45,149,.95),
       2.5px 0 rgba(0,240,255,.95),
      0 0 14px rgba(255,255,255,.55),
      0 0 34px rgba(162,75,255,.8),
      0 0 72px rgba(255,45,149,.55);
  }
  #merit.hit{ animation: hitAnim .3s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes hitAnim{
    0%  { transform:translate(0,0) scale(1) }
    15% { transform:translate(-2.5px,1px) scale(1.10) }
    30% { transform:translate(2.5px,-1.5px) scale(1.14) }
    45% { transform:translate(-2px,-1px) scale(1.08) }
    62% { transform:translate(1.5px,1px) scale(1.04) }
    100%{ transform:translate(0,0) scale(1) }
  }

  #merit.gold{
    color:#fff8e2;
    text-shadow:
      -2.5px 0 rgba(255,138,0,.9),
       2.5px 0 rgba(247,255,60,.85),
      0 0 16px var(--gold),
      0 0 42px rgba(255,179,0,.85),
      0 0 88px rgba(255,179,0,.5);
  }

  #merit-label{
    margin-top:11px;
    font-size: clamp(9px, 2.6vw, 12px);
    letter-spacing:.70em; text-indent:.70em;
    color:rgba(255,45,149,.75);
    text-shadow:0 0 12px rgba(255,45,149,.75), 0 0 26px rgba(255,45,149,.35);
  }

  /* ---------- 木鱼 ---------- */
  #fish-wrap{
    position:relative;
    width:min(84vw, 70vh, 420px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    touch-action:none;
  }
  #fish-wrap.shake{ animation: shake .17s ease-out; }
  @keyframes shake{
    0%{ transform:translate(0,0) }
    25%{ transform:translate(-2px,1px) }
    50%{ transform:translate(2.5px,-1.5px) }
    75%{ transform:translate(-1.5px,-1px) }
    100%{ transform:translate(0,0) }
  }

  #halo{
    position:absolute; inset:-20%;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 34%, rgba(255,45,149,.34) 0%, rgba(255,45,149,0) 52%),
      radial-gradient(circle at 66% 62%, rgba(0,240,255,.32) 0%, rgba(0,240,255,0) 54%),
      radial-gradient(circle, rgba(162,75,255,.24) 0%, rgba(162,75,255,0) 66%);
    animation: breathe 3.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:.6; transform:scale(.94) }
    50%    { opacity:1;  transform:scale(1.07) }
  }

  #fish{
    position:relative;
    width:100%; height:auto; display:block;
    filter:
      drop-shadow(0 0 9px rgba(255,45,149,.85))
      drop-shadow(0 0 30px rgba(162,75,255,.55));
    transform-origin:50% 62%;
    transition:transform .09s ease-out;
  }
  #fish.squash{ transform:scale(.955, .94); }

  /* ---------- 提示 ---------- */
  #hint{
    font-size: clamp(9.5px, 2.7vw, 12px);
    letter-spacing:.36em; text-indent:.36em;
    color:rgba(0,240,255,.42);
    text-shadow:0 0 12px rgba(0,240,255,.4);
    text-align:center; white-space:nowrap;
  }

  #reset{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(var(--safe-b) + 30px);
    z-index:9;
    padding:8px 15px;
    font:inherit; font-size:11px; letter-spacing:.18em;
    color:rgba(255,45,149,.62);
    background:rgba(255,45,149,.06);
    border:1px solid rgba(255,45,149,.32);
    border-radius:3px;
    backdrop-filter:blur(3px);
    opacity:.5; cursor:pointer;
    transition:opacity .25s, color .25s, border-color .25s, box-shadow .25s;
  }
  #reset:hover, #reset:active{
    opacity:1; color:#ffd0e8; border-color:rgba(255,45,149,.85);
    box-shadow:0 0 18px rgba(255,45,149,.55), inset 0 0 12px rgba(255,45,149,.18);
  }

  /* ============ 特效层 ============ */
  #flash{
    position:fixed; inset:0; z-index:2; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 56%, rgba(255,45,149,.34), rgba(0,240,255,.14) 34%, rgba(0,240,255,0) 62%);
  }
  #flash.on{ animation: flash .32s ease-out; }
  @keyframes flash{ 0%{opacity:.9} 100%{opacity:0} }

  #fx{ position:fixed; inset:0; z-index:3; pointer-events:none; }

  #texts{ position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden; }

  .float{
    position:absolute;
    font-weight:800;
    font-size: clamp(15px, 4.4vw, 22px);
    letter-spacing:.04em; white-space:nowrap;
    color:#fff;
    text-shadow:
      -1.5px 0 rgba(0,240,255,.95), 1.5px 0 rgba(255,45,149,.95),
      0 0 10px rgba(255,255,255,.6),
      0 0 26px rgba(162,75,255,.85),
      0 0 54px rgba(255,45,149,.5);
    animation: floatUp 1s cubic-bezier(.2,.7,.3,1) forwards;
    will-change:transform,opacity;
  }
  .float.zen{
    font-size: clamp(11px, 3.4vw, 15px);
    font-weight:600; letter-spacing:.22em;
    color:rgba(220,255,255,.9);
    text-shadow:0 0 12px rgba(0,240,255,.9), 0 0 30px rgba(0,240,255,.45);
  }
  .float.gold{
    color:#fff8e2;
    text-shadow:
      -2px 0 rgba(255,138,0,.9), 2px 0 rgba(247,255,60,.85),
      0 0 14px var(--gold), 0 0 38px rgba(255,179,0,.85), 0 0 76px rgba(255,179,0,.5);
  }
  @keyframes floatUp{
    0%  { opacity:0; transform:translate(-50%,6px)   scale(.55) }
    16% { opacity:1; transform:translate(-50%,-14px) scale(1.16) }
    38% { transform:translate(-50%,-30px) scale(1) }
    100%{ opacity:0; transform:translate(-50%,-120px) scale(.94) }
  }

  /* ============ CRT 扫描线（压在粒子上、飘字下） ============ */
  #scan{
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0 2px,
      rgba(0,0,0,.30) 2px 4px);
    opacity:.6;
  }
  #scanbar{
    position:fixed; left:0; right:0; height:140px; z-index:4; pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(0,240,255,0), rgba(0,240,255,.055) 45%, rgba(255,45,149,.05) 55%, rgba(0,240,255,0));
    animation: scanSweep 7.5s linear infinite;
  }
  @keyframes scanSweep{
    from{ transform:translateY(-150px) }
    to  { transform:translateY(100vh) }
  }

  @media (prefers-reduced-motion: reduce){
    #halo, #grid, #scanbar, #title{ animation:none; }
  }

  /* 小屏再压缩一点，保证不挤 */
  @media (max-height: 620px){
    #subtitle{ display:none; }
    #fish-wrap{ width:min(80vw, 58vh, 420px); }
  }
</style>
</head>
<body>

<div id="grid"></div>
<div class="hud tl"></div><div class="hud tr"></div>
<div class="hud bl"></div><div class="hud br"></div>

<div id="stage">
  <header id="topbar">
    <h1 id="title">赛博木鱼</h1>
    <div id="subtitle"><i class="dot"></i>CYBER MUYU · SYSTEM ONLINE</div>
  </header>

  <div id="merit-box">
    <div id="merit">0</div>
    <div id="merit-label">功德</div>
  </div>

  <div id="fish-wrap" role="button" tabindex="0" aria-label="敲击木鱼，功德加一">
    <div id="halo"></div>
    <svg id="fish" viewBox="0 0 300 200" aria-hidden="true">
      <defs>
        <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.75" y2="1">
          <stop offset="0"    stop-color="#1e0634"/>
          <stop offset="0.42" stop-color="#0e0419"/>
          <stop offset="1"    stop-color="#05010a"/>
        </linearGradient>
        <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"    stop-color="#7dfbff"/>
          <stop offset="0.28" stop-color="#00f0ff"/>
          <stop offset="0.62" stop-color="#a24bff"/>
          <stop offset="1"    stop-color="#ff2d95"/>
        </linearGradient>
        <radialGradient id="coreGrad" cx="0.38" cy="0.34" r="0.68">
          <stop offset="0"   stop-color="rgba(255,45,149,.20)"/>
          <stop offset="0.45" stop-color="rgba(162,75,255,.08)"/>
          <stop offset="1"   stop-color="rgba(0,240,255,0)"/>
        </radialGradient>
        <linearGradient id="slitGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff2d95"/>
          <stop offset="1" stop-color="#ff8a00"/>
        </linearGradient>
      </defs>

      <!-- 底座 -->
      <ellipse cx="120" cy="171" rx="76" ry="16"
               fill="#0a0316" stroke="url(#rimGrad)" stroke-width="2" opacity="0.95"/>

      <!-- 木鱼本体 -->
      <path d="M120 24
               C 64 24, 26 64, 26 108
               C 26 138, 44 162, 74 172
               L 166 172
               C 196 162, 214 138, 214 108
               C 214 64, 176 24, 120 24 Z"
            fill="url(#bodyGrad)" stroke="url(#rimGrad)" stroke-width="2.8"
            stroke-linejoin="round"/>

      <!-- 内部霓虹辉光 -->
      <path d="M120 24
               C 64 24, 26 64, 26 108
               C 26 138, 44 162, 74 172
               L 166 172
               C 196 162, 214 138, 214 108
               C 214 64, 176 24, 120 24 Z"
            fill="url(#coreGrad)"/>

      <!-- 电路纹 -->
      <g fill="none" stroke="rgba(0,240,255,.38)" stroke-width="1.6" stroke-linecap="round">
        <path d="M64 152 C 78 158, 96 160, 112 159"/>
        <path d="M150 44 C 166 48, 180 58, 188 70"/>
        <path d="M52 88 L 52 106 L 64 118"/>
      </g>
      <!-- 电路节点 -->
      <g fill="rgba(247,255,60,.8)">
        <circle cx="52" cy="88" r="2.2"/>
        <circle cx="188" cy="70" r="2.2"/>
        <circle cx="112" cy="159" r="2.2"/>
      </g>

      <!-- 侧边螺卷 -->
      <path d="M62 118 C 51 105, 53 87, 68 79 C 77 74, 86 79, 86 88 C 86 96, 78 99, 73 94"
            fill="none" stroke="rgba(255,45,149,.72)" stroke-width="2.6" stroke-linecap="round"/>

      <!-- 高光 -->
      <path d="M72 62 C 90 44, 114 36, 138 38"
            fill="none" stroke="rgba(200,252,255,.42)" stroke-width="7" stroke-linecap="round"/>

      <!-- 敲击口 -->
      <path d="M100 136 C 128 124, 158 130, 176 150"
            fill="none" stroke="rgba(255,45,149,.55)" stroke-width="16" stroke-linecap="round"/>
      <path d="M100 136 C 128 124, 158 130, 176 150"
            fill="none" stroke="#0a0316" stroke-width="9.5" stroke-linecap="round"/>
      <path d="M100 136 C 128 124, 158 130, 176 150"
            fill="none" stroke="url(#slitGrad)" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>

      <!-- 木槌 -->
      <g id="mallet" transform="translate(238,172) rotate(-14)">
        <line x1="0" y1="-24" x2="0" y2="-132"
              stroke="#8ff0ff" stroke-width="7" stroke-linecap="round" opacity=".85"/>
        <line x1="-1.7" y1="-26" x2="-1.7" y2="-128"
              stroke="rgba(235,255,255,.5)" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="-6" y="-124" width="12" height="9" rx="3"
              fill="#1a0430" stroke="rgba(255,45,149,.75)" stroke-width="1.4"/>
        <circle cx="0" cy="-150" r="17" fill="#12042a"
                stroke="url(#rimGrad)" stroke-width="2.8"/>
        <circle cx="0" cy="-150" r="7" fill="rgba(255,45,149,.6)"/>
        <circle cx="-5" cy="-156" r="3.4" fill="rgba(235,255,255,.7)"/>
      </g>
    </svg>
  </div>

  <div id="hint">轻 触 木 鱼 · 功 德 无 量</div>
</div>

<button id="reset" type="button">重置功德</button>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="scan"></div>
<div id="scanbar"></div>
<div id="texts"></div>

<script>
(function(){
  'use strict';

  const KEY = 'cyber-muyu-merit';

  const el = {
    merit:   document.getElementById('merit'),
    fish:    document.getElementById('fish'),
    wrap:    document.getElementById('fish-wrap'),
    mallet:  document.getElementById('mallet'),
    flash:   document.getElementById('flash'),
    texts:   document.getElementById('texts'),
    reset:   document.getElementById('reset'),
    canvas:  document.getElementById('fx')
  };

  /* ============ 音量 / 音效 ============ */
  let AC = null, master = null;

  function audio(){
    if (AC){
      if (AC.state === 'suspended') AC.resume();
      return AC;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    AC = new Ctx();

    master = AC.createGain();
    master.gain.value = 0.7;

    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 14;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.16;

    master.connect(comp).connect(AC.destination);
    return AC;
  }

  // 合成一记"梆"——空心木头的敲击声，不依赖任何音频文件
  function playKnock(){
    const ac = audio();
    if (!ac) return;

    const t = ac.currentTime + 0.001;
    const base = 560 * (0.955 + Math.random() * 0.09);   // 每下微抖，避免机械感

    const out = ac.createGain();
    out.gain.value = 0.9;
    out.connect(master);

    // 1) 木质基音：快速下滑 + 快速衰减
    const o1 = ac.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(base * 1.5, t);
    o1.frequency.exponentialRampToValueAtTime(base * 0.72, t + 0.085);
    const g1 = ac.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(0.55, t + 0.004);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
    o1.connect(g1).connect(out);
    o1.start(t); o1.stop(t + 0.25);

    // 2) 空腔泛音
    const o2 = ac.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(base * 2.7, t);
    o2.frequency.exponentialRampToValueAtTime(base * 1.9, t + 0.06);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.2, t + 0.003);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
    o2.connect(g2).connect(out);
    o2.start(t); o2.stop(t + 0.12);

    // 3) 起手"咔"的瞬态噪声
    const len = Math.max(1, Math.floor(ac.sampleRate * 0.012));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1400;
    const g3 = ac.createGain();
    g3.gain.value = 0.28;
    src.connect(hp).connect(g3).connect(out);
    src.start(t);

    setTimeout(function(){ try { out.disconnect(); } catch(e){} }, 600);
  }

  /* ============ 粒子 / 波纹画布 ============ */
  const cvs = el.canvas;
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width  = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width  = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

  // 预渲染辉光贴图（比每帧创建渐变快得多）
  function makeSprite(rgb){
    const S = 64;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grd.addColorStop(0,    'rgba(255,255,255,1)');
    grd.addColorStop(0.22, 'rgba(' + rgb + ',0.9)');
    grd.addColorStop(0.55, 'rgba(' + rgb + ',0.28)');
    grd.addColorStop(1,    'rgba(' + rgb + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    return c;
  }
  const SPRITE_CYAN    = makeSprite('0,240,255');
  const SPRITE_MAGENTA = makeSprite('255,45,149');
  const SPRITE_GOLD    = makeSprite('255,200,70');

  const particles = [];
  const ripples   = [];

  function emit(x, y, gold){
    const n = gold ? 30 : 16;

    // 火花：霓虹粉 / 电光青 随机混色
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = (gold ? 2.6 : 1.8) + Math.random() * (gold ? 5.4 : 3.8);
      particles.push({
        sprite: gold ? SPRITE_GOLD : (Math.random() < 0.55 ? SPRITE_MAGENTA : SPRITE_CYAN),
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.1,
        life: 0, max: 0.5 + Math.random() * (gold ? 0.7 : 0.45),
        size: (gold ? 9 : 6) + Math.random() * (gold ? 16 : 11)
      });
    }

    // 缓慢上浮的尘埃
    for (let i = 0; i < (gold ? 14 : 7); i++){
      particles.push({
        sprite: gold ? SPRITE_GOLD : (Math.random() < 0.5 ? SPRITE_CYAN : SPRITE_MAGENTA),
        x: x + (Math.random() - 0.5) * 44,
        y: y + (Math.random() - 0.5) * 26,
        vx: (Math.random() - 0.5) * 0.7,
        vy: -0.5 - Math.random() * 1.1,
        life: 0, max: 0.9 + Math.random() * 0.9,
        size: 3 + Math.random() * 6
      });
    }

    // 冲击波：粉 + 青 双环错开，出 RGB 色散感
    ripples.push({ x:x, y:y, r:8, max: gold?190:134, life:0, dur: gold?0.70:0.52,
                   color: gold ? '255,200,70' : '255,45,149', w: gold?4:3 });
    ripples.push({ x:x, y:y, r:8, max: gold?168:118, life:0, dur: gold?0.76:0.60,
                   color: gold ? '247,255,60' : '0,240,255', w: gold?3:2.4 });
  }

  /* ============ 木槌弹簧物理 ============ */
  const MALLET_PIVOT_X = 238;
  const MALLET_PIVOT_Y = 172;
  const MALLET_REST = -14;   // 静止位：槌头微微向木鱼倾
  const MALLET_HIT  = -58;   // 敲下去的最低点
  const MALLET_MAX  =  10;   // 回弹上限
  let mAngle = MALLET_REST;
  let mVel   = 0;
  let mAcc   = 0;            // 固定步长累加器

  function swingMallet(){
    // SVG 里负角度 = 逆时针 = 槌头朝木鱼挥下
    mVel -= 46;
  }

  /* ============ 主循环 ============ */
  let running = false;

  function frame(prev){
    const now = performance.now();
    const dt = Math.min((now - prev) / 1000, 0.05);

    ctx.clearRect(0, 0, W, H);

    // --- 波纹 ---
    if (ripples.length){
      ctx.globalCompositeOperation = 'lighter';
      for (let i = ripples.length - 1; i >= 0; i--){
        const rp = ripples[i];
        rp.life += dt;
        const p = rp.life / rp.dur;
        if (p >= 1){ ripples.splice(i, 1); continue; }
        rp.r = 8 + (rp.max - 8) * (1 - Math.pow(1 - p, 2.4));
        const alpha = (1 - p) * 0.7;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(' + rp.color + ',' + alpha + ')';
        ctx.lineWidth = rp.w * (1 - p * 0.65);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // --- 粒子 ---
    if (particles.length){
      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        p.life += dt;
        if (p.life >= p.max){ particles.splice(i, 1); continue; }
        p.vy += 5.2 * dt;              // 轻微重力
        p.vx *= (1 - 1.6 * dt);        // 空气阻力
        p.vy *= (1 - 0.9 * dt);
        p.x += p.vx;
        p.y += p.vy;

        const k = p.life / p.max;
        const alpha = k < 0.16 ? k / 0.16 : Math.pow(1 - (k - 0.16) / 0.84, 1.5);
        const s = p.size * (1 - k * 0.55);

        ctx.globalAlpha = Math.max(0, alpha);
        ctx.drawImage(p.sprite, p.x - s / 2, p.y - s / 2, s, s);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // --- 木槌弹簧（固定 1/60s 步长，60Hz / 120Hz 屏手感一致）---
    const STEP = 1 / 60;
    mAcc += dt;
    let guard = 0;
    while (mAcc >= STEP && guard++ < 6){
      mAcc -= STEP;
      const force = (MALLET_REST - mAngle) * 0.30;
      mVel = (mVel + force) * 0.66;
      mAngle += mVel;
      if (mAngle < MALLET_HIT){ mAngle = MALLET_HIT; if (mVel < 0) mVel *= -0.35; }
      if (mAngle > MALLET_MAX){ mAngle = MALLET_MAX; if (mVel > 0) mVel *= -0.35; }
    }
    el.mallet.setAttribute('transform',
      'translate(' + MALLET_PIVOT_X + ',' + MALLET_PIVOT_Y + ') rotate(' + mAngle.toFixed(2) + ')');

    const settled = Math.abs(mVel) < 0.05 && Math.abs(mAngle - MALLET_REST) < 0.08;

    if (particles.length || ripples.length || !settled){
      requestAnimationFrame(function(){ frame(now); });
    } else {
      mAngle = MALLET_REST; mVel = 0; mAcc = 0;
      el.mallet.setAttribute('transform',
        'translate(' + MALLET_PIVOT_X + ',' + MALLET_PIVOT_Y + ') rotate(' + MALLET_REST + ')');
      running = false;
    }
  }

  function wake(){
    if (running) return;
    running = true;
    mAcc = 0;
    requestAnimationFrame(function(t){ frame(t || performance.now()); });
  }

  /* ============ 坐标换算 ============ */
  function svgToScreen(x, y){
    const r = el.fish.getBoundingClientRect();
    const vb = el.fish.viewBox.baseVal;
    return {
      x: r.left + (x - vb.x) / vb.width  * r.width,
      y: r.top  + (y - vb.y) / vb.height * r.height
    };
  }

  /* ============ 飘字 ============ */
  const ZEN = ['心如止水','功德无量','赛博佛陀保佑你','佛光普照','一敲一世界','放下执念','色即是空','阿弥陀佛','静心凝神','万物皆空'];

  function floatText(x, y, text, cls){
    const d = document.createElement('div');
    d.className = 'float' + (cls ? ' ' + cls : '');
    d.textContent = text;
    d.style.left = x + 'px';
    d.style.top  = y + 'px';
    el.texts.appendChild(d);
    d.addEventListener('animationend', function(){ d.remove(); });
  }

  /* ============ 计数 ============ */
  let merit = 0;
  try {
    const saved = parseInt(localStorage.getItem(KEY), 10);
    if (Number.isFinite(saved) && saved >= 0) merit = saved;
  } catch (e) {}

  function renderMerit(){
    el.merit.textContent = merit.toLocaleString('en-US');
  }
  renderMerit();

  function saveMerit(){
    try { localStorage.setItem(KEY, String(merit)); } catch (e) {}
  }

  /* ============ 敲一下 ============ */
  let lastKnock = 0;

  function knock(){
    const now = performance.now();
    if (now - lastKnock < 28) return;      // 防连点糊在一起
    lastKnock = now;

    merit += 1;

    // 1) 音效
    playKnock();

    // 2) 震动（Android Chrome 支持；iOS Safari 无此 API，用画面抖动兜底）
    if (navigator.vibrate) {
      try { navigator.vibrate(16); } catch (e) {}
    }

    // 3) 计数 + 故障抖动
    renderMerit();
    el.merit.classList.remove('hit');
    void el.merit.offsetWidth;
    el.merit.classList.add('hit');

    el.fish.classList.add('squash');
    setTimeout(function(){ el.fish.classList.remove('squash'); }, 95);

    el.wrap.classList.remove('shake');
    void el.wrap.offsetWidth;
    el.wrap.classList.add('shake');

    el.flash.classList.remove('on');
    void el.flash.offsetWidth;
    el.flash.classList.add('on');

    // 4) 木槌 + 粒子
    swingMallet();
    const p = svgToScreen(128, 92);
    const isMilestone = (merit % 88 === 0);

    emit(p.x, p.y, isMilestone);
    wake();

    // 5) 飘字
    const jx = p.x + (Math.random() - 0.5) * 54;
    floatText(jx, p.y, '功德 +1', isMilestone ? 'gold' : '');

    if (isMilestone){
      el.merit.classList.add('gold');
      setTimeout(function(){ el.merit.classList.remove('gold'); }, 1100);
      floatText(p.x + (Math.random() - 0.5) * 30, p.y - 34,
                ZEN[(Math.random() * ZEN.length) | 0], 'zen');
    }

    saveMerit();
  }

  /* ============ 事件绑定 ============ */
  // 用 pointerdown 而不是 click：手机上零延迟，手感更"实"
  el.wrap.addEventListener('pointerdown', function(e){
    e.preventDefault();
    knock();
  }, { passive: false });

  el.wrap.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // 桌面端空格 / 回车
  document.addEventListener('keydown', function(e){
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter'){
      if (document.activeElement === el.reset) return;
      e.preventDefault();
      knock();
    }
  });

  // 屏蔽移动端双击缩放
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

  // 重置（二次确认）
  el.reset.addEventListener('click', function(){
    if (merit === 0) return;
    if (window.confirm('确定要把功德清零吗？此操作不可撤销。')){
      merit = 0;
      renderMerit();
      saveMerit();
      floatText(W / 2, H / 2, '功德已清零', 'zen');
    }
  });

})();
</script>
</body>
</html>
